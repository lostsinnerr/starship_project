<!-- File: "details.html" -->
<!-- Dettagli: vista nel dettaglio di una sola starship -->

<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<title>Starship - Details</title>
		
		<link rel="stylesheet" href="css/design.css">
		<script src="script/jquery-3.7.1.min.js"></script>
		<script src="script/details.js"></script>
	</head>
	
	<body id="bodyDetails">
		
		<nav id="navbar">
			<button onclick="window.location.href='home.html'">🏠 Home</button>
			<button onclick="history.back()">⬅️ Indietro</button>
			
			<!-- Menù a tendina -->
			<div class="dropdown">
				<button id="menuButton">⚙️ Segnala un bug!</button>
				<div class="dropdown-content" id="dropdownMenu">
					<form id="navbarForm">
						<label for="email">EMAIL:</label>
						<input type="email" id="email" placeholder="*Campo obbligatorio">

						<label for="segnalazione">SEGNALAZIONE:</label>
						<textarea id="segnalazione" name="segnalazione" rows="2" placeholder="*Campo obbligatorio"></textarea>

						<button type="submit">Invia</button>
					</form>
					<div id="formMessage" style="margin-top:10px;"></div>
				</div>
			</div>
			
		</nav>
		
		<h1 id="idTitoloDetails">NOME STARSHIP</h1>
		
		<!-- BLOCCO TITOLO + IMMAGINE + FILM -->
		<div id="topDetails">
			<div id="leftDetails">
				<img id="starshipImage" src="images/starships/default.png" alt="Starship Image" onerror="this.src='images/starships/default.png'">
			</div>
			
			<div id="rightDetails">
				<h2>Appare nei seguenti film:</h2>
				<div id="filmsImages"></div>
			</div>
		</div>
		
		<!-- CONTENITORE PRINCIPALE -->
		<div id="containerDetails">
			
			<!-- Sezione sinistra: tabella -->
			<div id="tableDetails"></div>
			
			<!-- Sezione destra: form -->
			<form>
				<table id="tableFormDetails">
					<tr>
						<th colspan="2">AGGIUNTA/MODIFICA CAMPI</th>
					</tr>
					<tr>
						<td>NOME CAMPO</td>
						<td><input type="text" id="nomeCampo" placeholder="NOME CAMPO" required></td>
					</tr>
					<tr>
						<td>VALORE</td>
						<td><input type="text" id="valoreCampo" placeholder="VALORE" required></td>
					</tr>
					<tr>
						<td colspan="2"><button type="submit" id="buttonStarship">💾Salva</button></td>
					</tr>
				</table>
			</form>
			
		</div>
		
		<script>
			$(document).ready(function(){
				// Apertura del menù al click sul pulsante:
				$("#menuButton").on("click", function(e){
					e.stopPropagation(); // Evita la chiusura immediata
					$("#dropdownMenu").toggleClass("show");
				});
				
				// Chiude il menù se si clicca fuori:
				$(document).on("click", function(e){
					if(!$(e.target).closest("#menuButton, #dropdownMenu").length){
						$("#dropdownMenu").removeClass("show");
					}
				});
				
				// Invio del form con $.post a "segnalazione.php":
				$("#navbarForm").on("submit", function(e){
					e.preventDefault();
					
					const dati = {
						email: $("#email").val().trim(),
						segnalazione: $("#segnalazione").val().trim()
					};

					// Controllo lato client:
					if(!dati.email || !dati.segnalazione){
						$("#formMessage").html("<p style='color:red'>Compila tutti i campi!</p>");
						return;
					}

					// Invio della richiesta POST a PHP:
					$.post("php/segnalazione.php", dati, function(risposta){
						$("#formMessage").html(risposta); // Mostra il messaggio restituito dal PHP
						
						$("#navbarForm")[0].reset(); // Reset del form
					});
				});
				
				// Adattamento automatico della textarea mentre si scrive:
				$("#segnalazione").on("input", function(){
					this.style.height = "auto"; // Resetta altezza
					this.style.height = this.scrollHeight + "px"; // Imposta l'altezza in base al contenuto
				});
			});
		</script>
		
	</body>
</html>
