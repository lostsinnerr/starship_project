<!-- File: "details.html" -->
<!-- Dettagli: vista nel dettaglio di una sola starship -->

<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<title>Starship - Details</title>
		
		<link rel="stylesheet" href="css/design.css">
		<script src="script/jquery-3.7.1.min.js"></script>
		<script src="script/details.js"></script>
	</head>
	
	<body id="bodyDetails">
		
		<nav id="navbar">
			<button onclick="window.location.href='home.html'">🏠 Home</button>
			<button onclick="history.back()">⬅️ Indietro</button>
		</nav>
		
		<h1 id="idTitoloDetails">NOME STARSHIP</h1>
			
		<!-- BLOCCO TITOLO + IMMAGINE + FILM -->
		<div id="topDetails">
			<div id="leftDetails">
				<img id="starshipImage" src="images/starships/default.png" alt="Starship Image" onerror="this.src='images/starships/default.png'">
			</div>
			
			<div id="rightDetails">
				<h2>Appare nei seguenti film:</h2>
				<div id="filmsImages"></div>
			</div>
		</div>
		
		<!-- CONTENITORE PRINCIPALE -->
		<div id="containerDetails">
			
			<!-- Sezione sinistra: tabella -->
			<div id="tableDetails"></div>
			
			<!-- Sezione destra: form -->
			<form>
				<table id="tableFormDetails">
					<tr>
						<th colspan="2">AGGIUNTA/MODIFICA CAMPI</th>
					</tr>
					<tr>
						<td>NOME CAMPO</td>
						<td><input type="text" id="nomeCampo" placeholder="NOME CAMPO" required></td>
					</tr>
					<tr>
						<td>VALORE</td>
						<td><input type="text" id="valoreCampo" placeholder="VALORE" required></td>
					</tr>
					<tr>
						<td colspan="2"><button type="submit" id="buttonStarship">💾Salva</button></td>
					</tr>
				</table>
			</form>
			
		</div>
		
	</body>
</html>
