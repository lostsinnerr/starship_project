<!-- Dettagli: tabella con starships di una sola classe -->

<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<title>Starships - Class</title>
		
		<link rel="stylesheet" href="css/design.css">
		<script src="script/jquery-3.7.1.min.js"></script>
		<script src="script/functions.js"></script>
	</head>
	<body>
		<a href="home.html">🏠 Home</a>
		<button onclick="history.back()">⬅️ Indietro</button>
		<h1 id="titoloClass"></h1>
		<table border="1" id="idTableClass">
			<thead>
				<tr><th>NOME</th><th>IMMAGINE</th></tr>
			</thead>
			<tbody></tbody>
		</table>

		<script>
			$(document).ready(function(){
				const params = new URLSearchParams(window.location.search);
				const starshipClass = params.get("class");
				$("#titoloClass").text("Classe: " + starshipClass);
				
				getAllStarships().then(function(allStarships){
					
					// Estrazione di tutte le starships appartenenti alla classe desiderata:
					const starships = allStarships.filter(s => s.starship_class && s.starship_class.toLowerCase().trim() === starshipClass.toLowerCase().trim());
					
					// Aggiunta delle righe nella table:
					starships.forEach(s => {
						$("#idTableClass tbody").append(`
							<tr data-url="${s.url}" class="rigaTableClass">
								<td>${s.name}</td>
								<td><img src="images/${s.name.replace(/ /g, '_')}.png" alt="${s.name}" onerror="this.src='images/default.png'" height="80"></td>
							</tr>
						`);
					});
					
					// Evento di click sulle righe della tabella:
					$("#idTableClass .rigaTableClass").on("click", function(){
					  const shipUrl = $(this).data("url");
					  window.location.href = `details.html?url=${encodeURIComponent(shipUrl)}`;
					});
				});
			});
		</script>
	</body>
</html>
