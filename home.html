<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<title>Starships - Home</title>
		
		<link rel="stylesheet" href="css/design.css">
		<script src="script/jquery-3.7.1.min.js"></script>
		<script src="script/functions.js"></script>
	</head>

	<body>
		<h1 id="titoloHome">STARSHIPS PROJECT - STAR WARS</h1>
		<div id="divClasse" class="grid"></div>

		<script>
			$(document).ready(function(){
				
				// Funzione che ritorna l'array contenente tutte le starships:
				getAllStarships().then(function(starships){
					
					// Estrazione delle classi uniche:
					const classes = estraiClassiUniche(starships);
					
					// Creazione dei riquadri per le classi:
					classes.forEach(cls => {
						$("#divClasse").append(`
							<div class="riquadroClasse" data-class="${cls}">
							  <img src="images/${cls.replace(/ /g, '_')}.png" alt="${cls}" onerror="this.src='images/default.png'">
							  <p>${cls}</p>
							</div>
						`);
					});
					
					// Evento di click sui riquadri:
					$(".riquadroClasse").on("click", function(){
						const selectedClass = $(this).data("class");
						window.location.href = `class.html?class=${encodeURIComponent(selectedClass)}`;
					});
					
				});
			});
		</script>
		
	</body>
	
</html>
